<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Series Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>🎬 Series Tracker</h1>
  </header>

  <main>
    <div id="controls"></div>
    <div id="series-list"></div>
    <div id="pagination"></div>
  </main>

  <!-- Modal -->
  <div id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">Nueva serie</h2>
        <button id="modal-close">✕</button>
      </div>

      <form id="series-form">
        <input type="hidden" id="series-id" />
        <input type="hidden" id="current-id" />

        <label>Nombre *</label>
        <input type="text" id="f-name" required />

        <label>Género</label>
        <input type="text" id="f-genre" />

        <label>Estado</label>
        <select id="f-status">
          <option value="">— Seleccionar —</option>
          <option value="En emisión">En emisión</option>
          <option value="Finalizada">Finalizada</option>
          <option value="Cancelada">Cancelada</option>
          <option value="Pendiente">Pendiente</option>
        </select>

        <label>Episodios</label>
        <input type="number" id="f-episodes" min="0" />

        <label>URL de imagen</label>
        <input type="text" id="f-image" placeholder="https://..." />

        <button type="submit">Guardar</button>
      </form>

      <div id="rating-section" style="display:none;">
        <hr />
        <h3>Agregar rating</h3>
        <input type="number" id="f-score" min="1" max="10" placeholder="1 - 10" />
        <button id="btn-rate">Calificar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
